<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATHY YURI'S CLINIC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #111;
            border-bottom: 2px solid #222;
            padding-bottom: 10px;
        }
        .card {
            border: 1px solid #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fff;
        }
        .btn {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #333;
        }
        .btn-secondary {
            background-color: #e9ecef;
            color: #495057;
            margin-left: 8px;
        }
        .btn-secondary:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MATHY YURI'S CLINIC — 관리자</h1>
    <div id="quiz-list">
        <!-- 생성된 클리닉 목록이 여기에 출력됩니다 -->
    </div>
</div>

<script src="clinicmaker.js"></script>
</body>
</html>
