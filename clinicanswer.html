<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATHY YURI'S CLINIC — 정답·해설</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7;
            color: #172b4d;
            padding: 20px;
        }
        .answer-container {
            max-width: 720px;
            margin: 30px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .info-box {
            background-color: #f8f9fa;
            border-left: 4px solid #000;
            padding: 12px 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #495057;
        }
        .solution-content {
            line-height: 1.7;
            font-size: 15px;
        }
        .error-msg {
            color: #de350b;
            font-weight: bold;
            text-align: center;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="answer-container">
    <div class="header">
        <h1>MATHY YURI'S CLINIC — 정답 및 해설</h1>
    </div>

    <div id="content-area">
        <!-- 스크립트로 내용이 들어갑니다 -->
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const keyId = urlParams.get('id');
        const contentArea = document.getElementById("content-area");

        if (!keyId) {
            contentArea.innerHTML = `
                <div class="error-msg">
                    ⚠️ 올바른 접근이 아닙니다. (해설 ID 파라미터가 누락되었습니다.)
                </div>
            `;
            return;
        }

        // 해설 화면 표시 (실제 로직 추가 위치)
        contentArea.innerHTML = `
            <div class="info-box">
                <strong>클리닉 ID:</strong> ${keyId}
            </div>
            <div class="solution-content">
                <h3>[정답 및 해설 보기]</h3>
                <p style="margin-top: 15px;">해당 클리닉(${keyId})의 상세 정답 및 해설 내용이 여기에 출력됩니다.</p>
            </div>
        `;
    });
</script>

</body>
</html>
