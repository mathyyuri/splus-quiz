<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATHY YURI'S CLINIC — 정답·해설</title>
<style>
body{font-family:'Noto Sans KR',sans-serif;background:#D9F0E6;color:#1A1A1A;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:6vw}
.msg{max-width:420px}
.msg h1{font-size:16px;margin-bottom:10px}
.msg p{font-size:13px;color:rgba(26,26,26,.6);line-height:1.6}
</style>
</head><body>
<div class="msg" id="msg"><h1>불러오는 중...</h1><p>정답·해설을 불러오고 있습니다.</p></div>
<script>
// 이 페이지는 clinicmaker.js가 문제은행에 함께 올려둔 정답·해설 HTML을
// id 하나만으로(로그인/키 없이) 그대로 열어주는 공유용 뷰어다 — 선생님이
// "저장된 클리닉 자료"에서 해설 링크를 복사해 학생/학부모에게 그대로
// 보내면, 받은 사람은 클릭만으로 이 페이지에서 바로 해설을 볼 수 있다.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynxupIBGMhIb6knPPTzCgQ3No_nId6YdjoKsvoFGZAEk4HkVztI0a6Wto5UfUww8e1/exec';
const CLINIC_KEY_MARKER = 'MYC_ANSWER_KEY_v1';

function showMsg(title, body, showRetry) {
  document.getElementById('msg').innerHTML = '<h1>' + title + '</h1><p>' + body + '</p>'
    + (showRetry ? '<button type="button" id="retryBtn" style="margin-top:14px;background:#1A1A1A;color:#D9F0E6;border:none;padding:9px 18px;border-radius:6px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">다시 시도</button>' : '');
  if (showRetry) document.getElementById('retryBtn').addEventListener('click', () => load(0));
}
function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
// 문제은행 전체 목록(action=list)은 그동안 쌓인 파일이 많아지면 응답이
// 꽤 느려질 수 있어(교재/정답해설이 매번 자동 업로드되며 계속 쌓임),
// 채점용 examroster 같은 좁은 조회보다 시간이 오래 걸리는 걸 실제로
// 확인했다 — 타임아웃을 넉넉히 주고, 한 번 정도는 자동으로 다시
// 시도해서 일시적인 지연/혼잡으로 인한 실패를 최대한 흡수한다.
function callGet(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const timer = setTimeout(() => { cleanup(); reject(new Error('요청 시간 초과')); }, timeoutMs || 45000);
    const script = document.createElement('script');
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = (data) => { cleanup(); if (!data.ok) reject(new Error(data.error || '서버 오류')); else resolve(data); };
    script.src = APPS_SCRIPT_URL + '?' + new URLSearchParams({ ...params, callback: cbName }).toString();
    script.onerror = () => { cleanup(); reject(new Error('스크립트 로드 실패')); };
    document.body.appendChild(script);
  });
}

async function load(retriesLeft) {
  const params = new URLSearchParams(location.search);
  const mission = params.get('mission');
  const legacyId = params.get('id');
  if (!mission && !legacyId) { showMsg('링크가 올바르지 않습니다', '해설 링크에 필요한 값이 없습니다.'); return; }
  document.getElementById('msg').innerHTML = '<h1>불러오는 중...</h1><p>정답·해설을 불러오고 있습니다.</p>';
  try {
    let id = legacyId;
    if (mission) {
      // id를 링크에 고정하지 않고, 열 때마다 문제은행에서 이 미션명의
      // 해설을 다시 검색해 "가장 최근에 올라온 것"을 연다 — 같은 클리닉의
      // 해설을 여러 번 재생성해도(예전 것이 지워지거나 옛 채로 남아있어도)
      // 링크는 항상 최신 해설을 가리키게 된다.
      const listData = await callGet({ action: 'list' });
      const candidates = (listData.files || []).filter(f =>
        (f.memo || '').startsWith(CLINIC_KEY_MARKER) && f.memo.slice(CLINIC_KEY_MARKER.length).trim() === mission);
      if (!candidates.length) {
        showMsg('해설을 찾을 수 없습니다', '"' + mission + '"에 대한 정답·해설 자료가 없습니다. 클리닉 도구에서 정답·해설을 다시 생성해주세요.');
        return;
      }
      candidates.sort((a, b) => new Date(b.uploadedAt || 0) - new Date(a.uploadedAt || 0));
      id = candidates[0].id;
    }
    const data = await callGet({ action: 'download', id });
    const file = data.file;
    if (!file || !(file.memo || '').includes(CLINIC_KEY_MARKER)) {
      showMsg('해설을 찾을 수 없습니다', '이 링크가 가리키는 자료가 정답·해설 파일이 아니거나 삭제되었습니다.');
      return;
    }
    const html = new TextDecoder().decode(base64ToArrayBuffer(file.data));
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    if ((retriesLeft || 0) > 0) { load(retriesLeft - 1); return; }
    showMsg('불러오기 실패', e.message || '잠시 후 다시 시도해주세요.', true);
  }
}
load(1);
</script>
</body></html>
